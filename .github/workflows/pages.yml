name: Deploy static website to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify HTML, CSS and asset contracts
        shell: pwsh
        run: ./scripts/verify-project.ps1

      - name: Run local HTTP smoke test
        shell: pwsh
        run: ./scripts/smoke-test.ps1

      - name: Set up Node.js for browser checks
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium for browser checks
        shell: bash
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run browser interaction and responsive checks
        shell: bash
        run: node scripts/browser-smoke.mjs

  deploy:
    needs: quality
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
